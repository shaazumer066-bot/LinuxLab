<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <title>LinuxLab</title>
</head>
<body>
    <header>
        <div class="navbar">
            <h1>LinuxLab</h1>
        </div>
    </header>

    <main class="container">
        <section class="intro">
            <h2>
                Interactive Linux Learning
            </h2>

            <p>
                Learn Linux through hands-on missions
                and an interactive terminal.
            </p>
        </section>

        <section class="terminalsection">
            <div class="terminalheader">
                <span>LinuxLab Terminal</span>
            </div>

            <div id="terminal">
                <div class="terminalline">
                    Welcome to LinuxLab!
                </div>

                <div class="terminalline">
                    Type a command to get started.
                </div>

                <div class="terminalinputline">
                    <span class="prompttext">student@linuxlab:~$</span>
                    <input type="text" id="commandinput" autocomplete="off" autofocus>
                </div>
            </div>
        </section>

    </main>

    <script src="/static/app.js"></script>

</body>
</html>
